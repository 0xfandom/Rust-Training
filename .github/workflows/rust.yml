name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: |
          if [ -f Cargo.toml ]; then cargo fmt --all -- --check; else echo "No Cargo workspace yet"; fi
      - name: Test
        run: |
          if [ -f Cargo.toml ]; then cargo test --workspace; else echo "No Cargo workspace yet"; fi
      - name: Clippy
        run: |
          if [ -f Cargo.toml ]; then cargo clippy --workspace --all-targets -- -D warnings; else echo "No Cargo workspace yet"; fi
